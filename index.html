<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lokkal — Marcas Colombianas</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --s1: #0d0d0d;
  --s2: #141414;
  --s3: #1e1e1e;
  --s4: #2a2a2a;
  --accent: #ff5722;
  --accent-glow: rgba(255,87,34,0.35);
  --accent2: #ffab40;
  --neon: linear-gradient(135deg, #ff5722, #ffab40);
  --text: #f8f4ef;
  --muted: #666;
  --muted2: #444;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.1);
  --r: 14px;
  --r2: 20px;
  --font: 'Syne', sans-serif;
  --body: 'Instrument Sans', sans-serif;
  --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--body); height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; }

/* ── SPINNER ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 22px; height: 22px; border: 2.5px solid rgba(255,255,255,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
.loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; min-height: 200px; color: var(--muted); font-size: 0.82rem; }

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 52px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 1rem;
  background: rgba(0,0,0,0.88); backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
}
.nav-logo { font-family: var(--font); font-size: 1.35rem; font-weight: 800; color: var(--text); cursor: pointer; letter-spacing: -0.03em; transition: opacity 0.2s var(--ease); }
.nav-logo:hover { opacity: 0.8; }
.nav-logo span { background: var(--neon); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.nav-right { display: flex; align-items: center; gap: 8px; }
#navAuth { display: flex; gap: 6px; }
#navUser { display: none; align-items: center; gap: 8px; }
.nav-av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--font); font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.3s var(--spring); border: 2px solid transparent; }
.nav-av:hover { border-color: var(--accent); transform: scale(1.05); }
.btn-n { border: none; border-radius: 50px; padding: 7px 15px; font-family: var(--font); font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all 0.3s var(--ease); letter-spacing: 0.01em; }
.btn-n.ghost { background: var(--s2); color: var(--text); border: 1px solid var(--border2); }
.btn-n.ghost:hover { background: var(--s3); border-color: var(--border2); }
.btn-n.pub { background: var(--accent); color: white; box-shadow: 0 0 16px var(--accent-glow); }
.btn-n.pub:hover { transform: translateY(-1px); box-shadow: 0 0 24px var(--accent-glow); }

/* ── SELLER ONLY ── */
.seller-only { display: none !important; }

/* ── MAIN ── */
.main { height: 100dvh; padding-top: 52px; padding-bottom: 56px; overflow: hidden; }
.view { height: 100%; display: none; }
#view-feed { display: block; overflow: hidden; padding: 0; }

/* ══════════════════════════════════
   FEED — TIKTOK STYLE
══════════════════════════════════ */
.feed-container {
  height: 100%; overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
}
.feed-container::-webkit-scrollbar { display: none; }

.feed-card {
  height: 100dvh; scroll-snap-align: start;
  position: relative; background: #000; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

.feed-media {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.4s var(--ease);
}
.feed-card:hover .feed-media { transform: scale(1.01); }

/* Gradient layers */
.feed-grad-top {
  position: absolute; top: 0; left: 0; right: 0; height: 180px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
  pointer-events: none; z-index: 1;
}
.feed-grad-bot {
  position: absolute; bottom: 0; left: 0; right: 0; height: 340px;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
  pointer-events: none; z-index: 1;
}

/* Brand row — top left */
.feed-top-row {
  position: absolute; top: 0; left: 0; right: 60px;
  padding: 1rem; z-index: 2; display: flex; align-items: center; gap: 10px;
}
.feed-av {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font); font-size: 1rem; font-weight: 700; color: white;
  border: 2px solid rgba(255,255,255,0.4); cursor: pointer;
  transition: all 0.3s var(--spring);
}
.feed-av:hover { transform: scale(1.08); border-color: white; }
.feed-bname { font-family: var(--font); font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
.feed-bname:hover { opacity: 0.8; }
.feed-bcity { font-size: 0.68rem; color: rgba(255,255,255,0.55); margin-top: 1px; }
.feed-weblink {
  margin-left: auto; background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
  color: white; border-radius: 50px; padding: 5px 11px;
  font-size: 0.7rem; text-decoration: none; font-family: var(--font);
  font-weight: 600; flex-shrink: 0; transition: all 0.3s var(--ease);
}
.feed-weblink:hover { background: rgba(255,255,255,0.2); }

/* Right action bar — TikTok style */
.feed-actions {
  position: absolute; right: 10px; bottom: 100px;
  z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 18px;
}
.feed-action-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: none; cursor: pointer;
  transition: transform 0.3s var(--spring);
}
.feed-action-btn:hover { transform: scale(1.1); }
.feed-action-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.08); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s var(--ease);
}
.feed-action-icon:hover { background: rgba(255,255,255,0.18); }
.feed-action-icon.liked { background: rgba(255,87,34,0.3); border-color: var(--accent); }
.feed-action-icon svg { width: 20px; height: 20px; }
.feed-action-count { font-size: 0.65rem; font-family: var(--font); font-weight: 600; color: rgba(255,255,255,0.8); }
.feed-wa-action .feed-action-icon { background: rgba(37,211,102,0.2); border-color: rgba(37,211,102,0.4); }
.feed-wa-action .feed-action-icon:hover { background: rgba(37,211,102,0.35); }

/* Product info — bottom left */
.feed-info {
  position: absolute; bottom: 0; left: 0; right: 70px;
  padding: 1rem; z-index: 2;
}
.feed-pname { font-family: var(--font); font-size: 1.1rem; font-weight: 700; margin-bottom: 3px; line-height: 1.2; }
.feed-price { font-family: var(--font); font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; background: var(--neon); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.feed-variants { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; align-items: center; }
.feed-cdot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); flex-shrink: 0; }
.feed-stag { background: rgba(255,255,255,0.1); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 6px; padding: 2px 8px; font-size: 0.7rem; font-family: var(--font); font-weight: 600; }
.feed-desc { font-size: 0.8rem; color: rgba(255,255,255,0.7); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ══════════════════════════════════
   EXPLORE
══════════════════════════════════ */
#view-explore { overflow-y: auto; padding: 1rem; }
#view-explore::-webkit-scrollbar { display: none; }
.exheader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.extitle { font-family: var(--font); font-size: 1.2rem; font-weight: 700; }
.btn-add { background: var(--accent); color: white; border: none; border-radius: 50px; padding: 8px 15px; font-family: var(--font); font-size: 0.76rem; font-weight: 700; cursor: pointer; transition: all 0.3s var(--spring); box-shadow: 0 0 12px var(--accent-glow); }
.btn-add:hover { transform: translateY(-1px); box-shadow: 0 0 20px var(--accent-glow); }
.explore-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.excard {
  background: var(--s1); border: 1px solid var(--border); border-radius: var(--r2);
  overflow: hidden; cursor: pointer;
  transition: all 0.3s var(--ease);
}
.excard:hover { transform: translateY(-4px); border-color: var(--border2); box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
.excover { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }
.exbody { padding: 0.75rem; }
.exav-wrap { position: relative; display: inline-block; margin-top: -24px; margin-bottom: 6px; }
.exav { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--font); font-size: 1rem; font-weight: 700; color: white; border: 3px solid var(--bg); }
.exv { position: absolute; bottom: -3px; right: -3px; background: #3b82f6; color: white; border-radius: 50%; width: 15px; height: 15px; font-size: 8px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
.exname { font-family: var(--font); font-size: 0.88rem; font-weight: 700; margin-bottom: 2px; }
.excat { font-size: 0.7rem; color: var(--muted); margin-bottom: 5px; }
.exstats { display: flex; gap: 8px; font-size: 0.68rem; color: var(--muted); }
.exstats b { color: var(--text); }

/* ══════════════════════════════════
   BRAND PROFILE — INSTAGRAM STYLE
══════════════════════════════════ */
#view-brand { overflow-y: auto; padding: 0; }
#view-brand::-webkit-scrollbar { display: none; }
.bp-back {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  font-family: var(--font); font-size: 0.85rem; font-weight: 700;
  cursor: pointer; border: none; color: var(--text); width: 100%;
  transition: background 0.2s;
}
.bp-back:hover { background: rgba(20,20,20,0.9); }
.bp-cover { height: 150px; display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; overflow: hidden; }
.bp-cover-blur { position: absolute; inset: 0; filter: blur(20px) saturate(1.5); transform: scale(1.2); }
.bp-cover-emoji { position: relative; z-index: 1; font-size: 4rem; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
.bp-meta { padding: 0 1rem 1rem; }
.bp-av-row { display: flex; align-items: flex-end; justify-content: space-between; margin-top: -28px; margin-bottom: 10px; }
.bp-av-wrap { position: relative; }
.bp-av { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font); font-size: 2rem; font-weight: 700; color: white; border: 4px solid var(--bg); box-shadow: 0 0 0 1px var(--border2); }
.bp-vbadge { position: absolute; bottom: 2px; right: 2px; background: #3b82f6; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
.bp-wa-btn { display: inline-flex; align-items: center; gap: 6px; background: #25d366; color: white; border: none; border-radius: 8px; padding: 9px 16px; font-family: var(--font); font-size: 0.8rem; font-weight: 700; cursor: pointer; text-decoration: none; transition: all 0.3s var(--spring); }
.bp-wa-btn:hover { transform: translateY(-1px); }
.bp-name { font-family: var(--font); font-size: 1.15rem; font-weight: 700; }
.bp-handle { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
.bp-stats { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 10px; }
.bp-stat { flex: 1; padding: 10px 8px; text-align: center; border-right: 1px solid var(--border); }
.bp-stat:last-child { border-right: none; }
.bp-stat-n { font-family: var(--font); font-size: 1rem; font-weight: 700; }
.bp-stat-l { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
.bp-bio { font-size: 0.84rem; line-height: 1.55; color: rgba(248,244,239,0.8); margin-bottom: 8px; }
.bp-weblink { font-size: 0.82rem; color: #60a5fa; text-decoration: none; display: inline-block; margin-bottom: 12px; }
.bp-weblink:hover { text-decoration: underline; }
.bp-divider { height: 1px; background: var(--border); }
.bp-tabs { display: flex; border-bottom: 1px solid var(--border); }
.bp-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--muted); font-family: var(--font); font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent; }
.bp-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.bp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.bp-tile { aspect-ratio: 1; position: relative; overflow: hidden; cursor: pointer; background: var(--s2); }
.bp-tile img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s var(--ease); }
.bp-tile:hover img { transform: scale(1.06); }
.bp-tile-over { position: absolute; inset: 0; background: rgba(0,0,0,0); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: background 0.3s; }
.bp-tile:hover .bp-tile-over { background: rgba(0,0,0,0.5); }
.bp-tile-name { font-family: var(--font); font-size: 0.72rem; font-weight: 700; text-align: center; padding: 0 4px; opacity: 0; transition: opacity 0.3s; }
.bp-tile-price { font-size: 0.68rem; background: var(--neon); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700; opacity: 0; transition: opacity 0.3s; }
.bp-tile:hover .bp-tile-name, .bp-tile:hover .bp-tile-price { opacity: 1; }
.bp-empty { grid-column: span 3; text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.85rem; }

/* ══════════════════════════════════
   LOGIN
══════════════════════════════════ */
#view-login { display: flex; align-items: center; justify-content: center; overflow-y: auto; }
.auth-box { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r2); padding: 1.8rem; width: 100%; max-width: 360px; margin: 1rem; }
.auth-logo { font-family: var(--font); font-size: 1.7rem; font-weight: 800; text-align: center; margin-bottom: 0.2rem; }
.auth-logo span { background: var(--neon); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.auth-sub { text-align: center; color: var(--muted); font-size: 0.82rem; margin-bottom: 1.2rem; }
.role-selector { display: flex; gap: 8px; margin-bottom: 1.2rem; }
.role-btn { flex: 1; background: var(--s2); border: 1.5px solid var(--border); color: var(--muted); border-radius: 12px; padding: 12px 8px; font-family: var(--font); font-size: 0.82rem; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.3s var(--ease); }
.role-btn span { font-size: 1.2rem; }
.role-btn.selected { border-color: var(--accent); background: rgba(255,87,34,0.08); color: var(--text); box-shadow: 0 0 12px var(--accent-glow); }
.btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: white; color: #1a1a1a; border: none; border-radius: 50px; padding: 11px; font-family: var(--font); font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 1rem; transition: all 0.3s var(--ease); }
.btn-google:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.divider { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; color: var(--muted); font-size: 0.75rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-tabs { display: flex; background: var(--s2); border-radius: 50px; padding: 3px; margin-bottom: 1.2rem; }
.auth-tab { flex: 1; background: none; border: none; color: var(--muted); font-family: var(--font); font-size: 0.8rem; font-weight: 600; padding: 7px; border-radius: 50px; cursor: pointer; transition: all 0.3s var(--ease); }
.auth-tab.active { background: var(--s1); color: var(--text); }

/* ══════════════════════════════════
   PROFILE VIEW
══════════════════════════════════ */
#view-profile { overflow-y: auto; }
#view-profile::-webkit-scrollbar { display: none; }
.mp-cover { height: 110px; background: linear-gradient(135deg, #1a0a00, #2d1200, #0d0d0d); }
.mp-body { padding: 0 1rem 2rem; }
.mp-av-wrap { margin-top: -30px; margin-bottom: 8px; }
.mp-av { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--font); font-size: 1.6rem; font-weight: 700; color: white; border: 4px solid var(--bg); }
.mp-name { font-family: var(--font); font-size: 1.05rem; font-weight: 700; }
.mp-email { font-size: 0.78rem; color: var(--muted); margin-bottom: 1rem; }
.mp-btns { display: flex; gap: 8px; margin-bottom: 1.2rem; }
.mp-btn { flex: 1; padding: 9px; border-radius: 10px; font-family: var(--font); font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.3s var(--ease); border: none; }
.mp-btn.primary { background: var(--accent); color: white; box-shadow: 0 0 12px var(--accent-glow); }
.mp-btn.primary:hover { box-shadow: 0 0 20px var(--accent-glow); }
.mp-btn.ghost { background: var(--s2); color: var(--text); border: 1px solid var(--border); }
.mp-stats { display: flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 1.2rem; }
.mp-stat { flex: 1; padding: 10px; text-align: center; border-right: 1px solid var(--border); }
.mp-stat:last-child { border-right: none; }
.mp-stat-n { font-family: var(--font); font-size: 1rem; font-weight: 700; }
.mp-stat-l { font-size: 0.68rem; color: var(--muted); }
.mp-empty { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.84rem; border: 1px dashed var(--border); border-radius: var(--r); margin-bottom: 1rem; line-height: 1.8; }
.mp-logout { width: 100%; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 50px; padding: 9px; font-family: var(--font); font-size: 0.8rem; cursor: pointer; transition: all 0.3s var(--ease); margin-top: 1rem; }
.mp-logout:hover { border-color: var(--accent); color: var(--accent); }

/* ══════════════════════════════════
   FORMS
══════════════════════════════════ */
.fg { margin-bottom: 0.85rem; }
.fl { font-size: 0.7rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; display: block; letter-spacing: 0.07em; text-transform: uppercase; }
.fi, .fsel, .fta {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-family: var(--body); font-size: 0.87rem;
  background: var(--s2); color: var(--text); outline: none;
  transition: all 0.3s var(--ease);
}
.fi:focus, .fsel:focus, .fta:focus { border-color: var(--accent); background: var(--s3); box-shadow: 0 0 0 3px var(--accent-glow); }
.fsel option { background: var(--s2); }
.fta { resize: vertical; min-height: 65px; }
.btn-sub {
  width: 100%; background: var(--accent); color: white; border: none;
  border-radius: 50px; padding: 13px; font-family: var(--font);
  font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 0.3rem;
  transition: all 0.3s var(--ease); box-shadow: 0 0 16px var(--accent-glow);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-sub:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 24px var(--accent-glow); }
.btn-sub:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

/* ══════════════════════════════════
   COLOR & SIZE PICKERS
══════════════════════════════════ */
.colors-grid { display: flex; flex-wrap: wrap; gap: 9px; }
.color-btn {
  width: 30px; height: 30px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer;
  transition: all 0.3s var(--spring); position: relative;
}
.color-btn::after {
  content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: white; opacity: 0;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8); transition: opacity 0.2s;
}

.sizes-grid { display: flex; flex-wrap: wrap; gap: 6px; }

/* ══════════════════════════════════

══════════════════════════════════ */
.modal-overlay {

@media(min-width: 600px) { .modal-overlay { align-items: center; } }
.modal {
  background: var(--s1); border-radius: 22px 22px 0 0;
  padding: 1.2rem 1.2rem 2rem; width: 100%; max-width: 480px;
  max-height: 92dvh; overflow-y: auto; position: relative;
  transform: translateY(100%); transition: transform 0.4s var(--ease);
}
.modal-overlay.open .modal { transform: translateY(0); }
@media(min-width: 600px) { .modal { border-radius: 22px; transform: scale(0.95); } .modal-overlay.open .modal { transform: scale(1); } }
.modal::-webkit-scrollbar { display: none; }
.modal-handle { width: 36px; height: 4px; background: var(--s4); border-radius: 2px; margin: 0 auto 1rem; }
.modal-title { font-family: var(--font); font-size: 1.1rem; font-weight: 700; }
.modal-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 1rem; margin-top: 2px; }
.mcl { position: absolute; top: 1.1rem; right: 1.1rem; background: var(--s2); border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; color: var(--muted); font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.mcl:hover { background: var(--s3); color: var(--text); }

/* Upload area */
.upload-area {
  border: 2px dashed var(--border); border-radius: 12px;
  padding: 1.3rem; text-align: center; cursor: pointer; display: block;
  transition: all 0.3s var(--ease); margin-bottom: 6px;
}
.upload-area:hover { border-color: var(--accent); background: rgba(255,87,34,0.04); }
.upload-area.uploading { border-color: var(--accent2); background: rgba(255,171,64,0.06); cursor: not-allowed; }
.upload-progress { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0.5rem 0; }
.upload-progress-text { font-size: 0.78rem; color: var(--accent2); font-family: var(--font); font-weight: 600; }

/* ══════════════════════════════════
   BOTTOM NAV
══════════════════════════════════ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
  background: rgba(0,0,0,0.94); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); display: flex; z-index: 100;
}
.bottom-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; background: none; border: none; color: var(--muted);
  font-family: var(--font); font-size: 0.58rem; font-weight: 600; cursor: pointer;
  transition: all 0.3s var(--ease); letter-spacing: 0.03em;
}
.bottom-tab svg { width: 19px; height: 19px; transition: transform 0.3s var(--spring); }
.bottom-tab.active { color: var(--text); }
.bottom-tab.active svg { transform: scale(1.1); }
.bottom-tab:hover svg { transform: scale(1.05); }
.pub-tab-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
.pub-tab-btn { width: 46px; height: 46px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; box-shadow: 0 0 18px var(--accent-glow); transition: all 0.3s var(--spring); }
.pub-tab-btn:hover { transform: scale(1.08); box-shadow: 0 0 26px var(--accent-glow); }
.pub-tab-btn svg { width: 22px; height: 22px; }

/* ══════════════════════════════════

══════════════════════════════════ */
.toast {

}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ══════════════════════════════════

══════════════════════════════════ */
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.86rem; line-height: 2; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

</style>

// ── LOAD FEED ──
async function loadFeed() {
  const container = document.getElementById('feedContainer');
  container.innerHTML = `<div class="loading-state"><div class="spinner"></div><span>Cargando feed...</span></div>`;
  try {
    const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
    const snapshot = await getDocs(q);
    if (snapshot.empty) {
      container.innerHTML = `<div class="empty-state">🛍️<br>Aún no hay productos publicados.<br>¡Sé el primero!</div>`;
      return;
    }
    let products = [];
    snapshot.forEach(d => products.push({ id: d.id, ...d.data() }));
    // Shuffle for variety
    products = products.sort(() => Math.random() - 0.5);
    container.innerHTML = '';
    products.forEach(p => container.appendChild(createFeedCard(p)));
  } catch(err) {
    container.innerHTML = `<div class="empty-state">Error al cargar el feed.<br><small>${err.message}</small></div>`;

}

  const waMsg = encodeURIComponent(`¡Hola! Vi *${p.name}* en Lokkal y me interesa. ¿Podés darme más info? 🛍️`);
  const waUrl = `https://wa.me/${(p.whatsapp||'').replace(/\D/g,'')}?text=${waMsg}`;
  const isLiked = likedProducts.has(p.id);
  const brandInitial = (p.brandName||'?')[0].toUpperCase();

  card.innerHTML = `
    ${media}
    <div class="feed-grad-top"></div>
    <div class="feed-grad-bot"></div>
    <div class="feed-top-row">
      <div class="feed-av" style="background:${p.brandColor||'#ff5722'}" onclick="openBrandProfile('${p.brandName||''}')">

      <div>
        <div class="feed-bname" onclick="openBrandProfile('${p.brandName||''}')">${p.brandName||'Marca'}</div>

            <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>

          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>

        <div class="feed-action-icon">
          <svg viewBox="0 0 24 24" fill="#25d366" width="20" height="20">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
            <path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.113 1.527 5.842L.057 23.999l6.306-1.654A11.954 11.954 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.795 9.795 0 01-4.988-1.365l-.358-.213-3.712.974.991-3.618-.234-.372A9.78 9.78 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/>
          </svg>
        </div>
        <span class="feed-action-count">Pedir</span>
      </a>
    </div>
    <div class="feed-info">
      <div class="feed-pname">${p.name}</div>
      <div class="feed-price">$${Number(p.price||0).toLocaleString('es-CO')} COP</div>
      ${(p.colors?.length||p.sizes?.length) ? `
      <div class="feed-variants">
        ${(p.colors||[]).map(c=>`<span class="feed-cdot" style="background:${c}"></span>`).join('')}
        ${(p.sizes||[]).map(s=>`<span class="feed-stag">${s}</span>`).join('')}
      </div>` : ''}
      <div class="feed-desc">${p.description||''}</div>
    </div>
  `;

  if (isVideo) {
    const vid = card.querySelector('video');
    new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) vid.play().catch(()=>{}); else vid.pause(); });
    }, { threshold: 0.6 }).observe(card);
  }
  return card;
}

window.toggleLike = function(id, btn) {
  const icon = btn.querySelector('.feed-action-icon');
  const svg = btn.querySelector('svg');
  const count = btn.querySelector('.feed-action-count');
  if (likedProducts.has(id)) {
    likedProducts.delete(id);
    icon.classList.remove('liked');
    svg.setAttribute('fill','none'); svg.setAttribute('stroke','white');
    count.textContent = Math.max(0, parseInt(count.textContent)-1);
  } else {
    likedProducts.add(id);
    icon.classList.add('liked');
    svg.setAttribute('fill','#ff5722'); svg.setAttribute('stroke','#ff5722');
    count.textContent = parseInt(count.textContent)+1;
    btn.style.transform = 'scale(1.3)';
    setTimeout(() => btn.style.transform = '', 300);
  }
  localStorage.setItem('lokkal_likes', JSON.stringify([...likedProducts]));
};

window.shareProduct = function(id, name) {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: decodeURIComponent(name), text: `Mira esto en Lokkal`, url });
  } else {
    navigator.clipboard?.writeText(url).then(() => showToast('🔗 Enlace copiado'));
  }
};

// ── BRAND PROFILE ──

window.scrollToProduct = function(name) {
  showView('feed');

};

// ── LOAD BRANDS ──
async function loadBrands() {
  const grid = document.getElementById('exploreGrid');
  grid.innerHTML = `<div class="loading-state" style="grid-column:1/-1"><div class="spinner"></div></div>`;
  try {
    const q = query(collection(db, "brands"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    if (snap.empty) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">🏪<br>Aún no hay marcas registradas.<br>¡Sé el primero!</div>`;
      return;
    }
    const brandColors = ['#ff5722','#ffab40','#185fa5','#6b2fa0','#2d6a4f','#c8506a','#7b4f2e'];
    grid.innerHTML = '';
    snap.forEach(d => {
      const b = d.data();
      const color = b.color || brandColors[Math.floor(Math.random()*brandColors.length)];
      const card = document.createElement('div');
      card.className = 'excard animate-in';
      card.onclick = () => openBrandProfile(b.name);
      card.innerHTML = `
        <div class="excover" style="background:linear-gradient(135deg,${color}33,${color}66)">${b.emoji||'🏪'}</div>
        <div class="exbody">
          <div class="exav-wrap">
            <div class="exav" style="background:${color}">${b.name[0].toUpperCase()}</div>
            ${b.verified?'<div class="exv">✓</div>':''}
          </div>
          <div class="exname">${b.name}</div>
          <div class="excat">${b.category||'General'} · ${b.city||'Colombia'}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  } catch(err) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">Error al cargar marcas.<br><small>${err.message}</small></div>`;
  }
}

// ── PROFILE ──
function loadProfile() {
  if (!window._currentUser) { showView('login'); return; }
  const u = window._currentUser;
  document.getElementById('profileAv').textContent = (u.displayName||u.email)[0].toUpperCase();
  document.getElementById('profileName').textContent = u.displayName || 'Usuario de Lokkal';
  document.getElementById('profileEmail').textContent = u.email;
}

// ── PUBLISH ──
window.openPublish = function() {
  if (!window._currentUser) { showToast('Inicia sesión para publicar'); showView('login'); return; }
  const overlay = document.getElementById('modalPublish');
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('open'));
};
window.closePublish = function() {
  const overlay = document.getElementById('modalPublish');
  overlay.classList.remove('open');
  setTimeout(() => { overlay.style.display = 'none'; }, 400);
  document.getElementById('publishForm').reset();
  document.getElementById('mediaPreview').innerHTML = '';
  document.getElementById('uploadLabel').classList.remove('uploading');
  document.getElementById('uploadLabel').innerHTML = '<div style="font-size:1.8rem;margin-bottom:4px">📸</div><div style="font-size:0.78rem;color:var(--muted)">Toca para subir foto o video</div>';
  selectedColors = []; selectedSizes = [];
  currentUploadedMediaUrl = '';
  document.querySelectorAll('.color-btn.selected,.size-btn.selected').forEach(el => el.classList.remove('selected'));
};

window.openBrandModal = function() {
  if (!window._currentUser) { showToast('Inicia sesión primero'); showView('login'); return; }
  const overlay = document.getElementById('modalBrand');
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('open'));
};
window.closeBrandModal = function() {
  const overlay = document.getElementById('modalBrand');
  overlay.classList.remove('open');
  setTimeout(() => { overlay.style.display = 'none'; }, 400);
};

// ── MEDIA UPLOAD ──
window.previewMedia = async function(input) {
  const file = input.files[0];
  if (!file) return;
  const btn = document.getElementById('btnPublish');
  const label = document.getElementById('uploadLabel');
  const preview = document.getElementById('mediaPreview');
  btn.disabled = true;
  label.classList.add('uploading');
  label.innerHTML = `<div class="upload-progress"><div class="spinner"></div><div class="upload-progress-text">Procesando archivo...</div></div>`;
  currentUploadedMediaUrl = '';
  currentMediaType = file.type.startsWith('video') ? 'video' : 'image';
  try {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${currentMediaType}/upload`, { method: 'POST', body: form });
    const data = await res.json();
    if (data.secure_url) {
      currentUploadedMediaUrl = data.secure_url;
      label.classList.remove('uploading');
      label.innerHTML = '<div style="font-size:1rem;color:var(--accent2);font-weight:600">✓ Archivo listo</div>';
      if (currentMediaType === 'video') {
        preview.innerHTML = `<video src="${data.secure_url}" controls muted style="width:100%;max-height:180px;border-radius:10px;margin-top:8px;object-fit:cover"></video>`;
      } else {
        preview.innerHTML = `<img src="${data.secure_url}" style="width:100%;max-height:180px;border-radius:10px;margin-top:8px;object-fit:cover">`;
      }
      btn.disabled = false;
      showToast('✅ Multimedia lista');
    } else throw new Error(data.error?.message || 'Error de Cloudinary');
  } catch(err) {
    label.classList.remove('uploading');
    label.innerHTML = '<div style="font-size:1.8rem;margin-bottom:4px">📸</div><div style="font-size:0.78rem;color:var(--muted)">Toca para subir foto o video</div>';
    preview.innerHTML = `<div style="color:#ff5722;font-size:0.78rem;padding:0.5rem">❌ ${err.message}</div>`;
    btn.disabled = false;
    showToast('Error al subir archivo');
  }
};

// ── SUBMIT PRODUCT ──
window.submitProduct = async function() {
  const name = document.getElementById('prodName').value.trim();
  const price = document.getElementById('prodPrice').value.trim();
  const brand = document.getElementById('prodBrand').value.trim();
  const city = document.getElementById('prodCity').value.trim();
  const whatsapp = document.getElementById('prodWhatsapp').value.trim();
  const url = document.getElementById('prodBrandUrl').value.trim();
  const desc = document.getElementById('prodDesc').value.trim();
  const btn = document.getElementById('btnPublish');
  if (!name || !price || !brand || !whatsapp || !currentUploadedMediaUrl) {
    showToast('⚠️ Completa todos los campos y sube un archivo');
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Publicando...';
  try {
    await addDoc(collection(db, "products"), {
      name, price: Number(price), brandName: brand,
      city: city || "Colombia", whatsapp, website: url || "",
      colors: selectedColors, sizes: selectedSizes, description: desc,
      mediaUrl: currentUploadedMediaUrl, mediaType: currentMediaType,
      userId: window._currentUser.uid, likes: 0,
      createdAt: serverTimestamp()
    });
    showToast('🎉 ¡Producto publicado!');
    window.closePublish();
    loadFeed(); showView('feed');
  } catch(err) {
    showToast('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Publicar producto 🚀';
  }
};

// ── SUBMIT BRAND ──
window.submitBrand = async function() {
  const name = document.getElementById('brandName').value.trim();
  const cat = document.getElementById('brandCat').value;
  const city = document.getElementById('brandCity').value.trim();
  const whatsapp = document.getElementById('brandWhatsapp').value.trim();
  const web = document.getElementById('brandWebsite').value.trim();
  const desc = document.getElementById('brandDesc').value.trim();
  if (!name || !city || !whatsapp) { showToast('⚠️ Completa los campos obligatorios'); return; }
  try {
    await addDoc(collection(db, "brands"), {
      name, category: cat, city, whatsapp, website: web || "",
      description: desc, userId: window._currentUser.uid,
      createdAt: serverTimestamp()
    });
    showToast('🎉 ¡Marca registrada!');
    window.closeBrandModal();
    loadBrands(); showView('explore');
  } catch(err) { showToast('Error: ' + err.message); }
};

// ── AUTH ──
window.selectRole = function(role) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('role-' + role).classList.add('selected');
};
window.showAuthTab = function(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('panel-register').style.display = tab === 'register' ? 'block' : 'none';
};
// Keep old name for compatibility
window.showTab = window.showAuthTab;
window.toggleColor = function(c, el) {
  if (selectedColors.includes(c)) { selectedColors = selectedColors.filter(x=>x!==c); el.classList.remove('selected'); }
  else { selectedColors.push(c); el.classList.add('selected'); }
};
window.toggleSize = function(s, el) {
  if (selectedSizes.includes(s)) { selectedSizes = selectedSizes.filter(x=>x!==s); el.classList.remove('selected'); }
  else { selectedSizes.push(s); el.classList.add('selected'); }
};
window.loginGoogle = async function() {
  const p = new GoogleAuthProvider();
  try {
    const result = await signInWithPopup(auth, p);
    const user = result.user;
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    let role = selectedRole;
    if (snap.exists()) { role = snap.data().role || selectedRole; await setDoc(ref, { email: user.email }, { merge: true }); }
    else { await setDoc(ref, { email: user.email, role, createdAt: serverTimestamp() }); }
    showToast('👋 ¡Bienvenido!');
    if (role === 'seller') { showView('explore'); window.openBrandModal(); }
    else showView('feed');
  } catch(err) { showToast('Error con Google'); }
};
window.loginEmail = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  if (!email || !pass) { showToast('Ingresa correo y contraseña'); return; }
  try { await signInWithEmailAndPassword(auth, email, pass); showToast('👋 ¡Bienvenido!'); showView('feed'); }
  catch(err) { showToast('Credenciales incorrectas'); }
};
window.registerEmail = async function() {
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value.trim();
  const btn = document.getElementById('btnRegister');
  if (!email || !pass || pass.length < 6) { showToast('Revisa los datos ingresados'); return; }
  btn.disabled = true; btn.textContent = 'Creando cuenta...';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, "users", cred.user.uid), { email, role: selectedRole, createdAt: serverTimestamp() });
    showToast('🎉 ¡Cuenta creada!');
    if (selectedRole === 'seller') { showView('explore'); window.openBrandModal(); }
    else showView('feed');
  } catch(err) { showToast('Error: ' + err.message); }
  finally { btn.disabled = false; btn.textContent = 'Crear cuenta'; }
};
window.logout = async function() {
  await signOut(auth);
  showToast('Sesión cerrada');
  showView('feed');
};

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) {
      overlay.classList.remove('open');
      setTimeout(() => { overlay.style.display = 'none'; }, 400);
    }
  });
});

// Init
showView('feed');
</script>
